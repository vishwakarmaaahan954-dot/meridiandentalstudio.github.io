<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your List - Anime Ranking</title>
    <link rel="stylesheet" href="HomePage.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⭐</span>
                <span>Your List</span>
            </div>
            <div class="nav-buttons">
                <button onclick="alert('Profile feature coming soon!')">Profile</button>
                <button onclick="alert('Settings feature coming soon!')">Settings</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="content">
            <!-- Anime List -->
            <div class="anime-section">
                <h2 class="section-title">📺 Your Anime Rankings</h2>
                <ul class="anime-list" id="animeList">
                    <!-- Anime items will be added here by JavaScript -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <div class="empty-state-icon">🎬</div>
                    <p>No animes yet! Add one to get started.</p>
                </div>
            </div>

            <!-- Add Anime Form -->
            <aside class="add-anime-section">
                <h3 class="section-title" style="margin-bottom: 20px;">➕ Add Anime</h3>
                
                <div class="form-group">
                    <label for="animeTitle">Anime Title</label>
                    <input 
                        type="text" 
                        id="animeTitle" 
                        placeholder="e.g., Attack on Titan"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="animeGenre">Genre</label>
                    <input 
                        type="text" 
                        id="animeGenre" 
                        placeholder="e.g., Action, Drama"
                    >
                </div>

                <div class="form-group">
                    <label for="animeNotes">Notes</label>
                    <textarea 
                        id="animeNotes" 
                        placeholder="Add your thoughts about this anime..."
                    ></textarea>
                </div>

                <button class="btn-add" onclick="addAnime()">Add to List</button>

                <div class="stats">
                    <div class="stats-value" id="totalAnimes">0</div>
                    <div class="stats-label">Animes Watched</div>
                </div>
            </aside>
        </div>
    </div>

</body>
</html>
